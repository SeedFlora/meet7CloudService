name: cloudlab07-rls

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: lab07
      POSTGRES_USER: labadmin
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labadmin -d lab07"]
      interval: 5s
      timeout: 3s
      retries: 12

  adminer:
    image: adminer:4
    profiles: [debug]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8087:8080"

volumes:
  db_data:

secrets:
  db_password:
    file: ./secrets/db_password.txt
